<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sardine's Playlist</title>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Instrument+Serif:ital@1&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      min-height: 100dvh;
      background:
        radial-gradient(ellipse 80% 60% at 15% 20%, rgba(255,110,60,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 70% 70% at 85% 10%, rgba(80,130,255,0.20) 0%, transparent 55%),
        radial-gradient(ellipse 60% 50% at 50% 95%, rgba(220,80,180,0.16) 0%, transparent 60%),
        linear-gradient(160deg, #06091f 0%, #0b1230 45%, #0e1a3a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 20px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 34% 55%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 67% 22%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 70%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 22% 80%, rgba(255,255,255,0.25) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 88%, rgba(255,200,255,0.3) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 90% 40%, rgba(200,220,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 44% 33%, rgba(255,255,255,0.2) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: #5588cc;
      margin-bottom: 8px;
    }

    h1 {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: clamp(34px, 9vw, 52px);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.02em;
      background: linear-gradient(110deg, #ff8c42 0%, #7ab0ff 50%, #f072c0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 20px rgba(180,120,255,0.25));
    }

    .playlist {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    /* div로 변경 — a태그 기본동작 충돌 제거 */
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      transform: scale(1);
      transition: transform 0.15s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .card:active {
      transform: scale(0.88);
      transition: transform 0.08s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .album-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 5px;
      overflow: hidden;
      position: relative;
    }

    .card:nth-child(1) .album-wrap { border: 1.5px solid rgba(255,140,66,0.4); box-shadow: 0 6px 24px rgba(0,0,0,0.55), 0 0 12px rgba(255,120,40,0.15); }
    .card:nth-child(2) .album-wrap { border: 1.5px solid rgba(120,170,255,0.4); box-shadow: 0 6px 24px rgba(0,0,0,0.55), 0 0 12px rgba(80,140,255,0.15); }
    .card:nth-child(3) .album-wrap { border: 1.5px solid rgba(240,100,200,0.4); box-shadow: 0 6px 24px rgba(0,0,0,0.55), 0 0 12px rgba(220,80,180,0.15); }
    .card:nth-child(4) .album-wrap { border: 1.5px solid rgba(160,220,255,0.4); box-shadow: 0 6px 24px rgba(0,0,0,0.55), 0 0 12px rgba(100,200,255,0.15); }

    .album-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      image-rendering: pixelated;
      filter: contrast(1.05) saturate(0.88) brightness(0.9);
    }

    .album-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.05) 3px, rgba(0,0,0,0.05) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(0,0,0,0.05) 3px, rgba(0,0,0,0.05) 4px);
      pointer-events: none;
    }

    .track-title {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 12px;
      letter-spacing: 0.02em;
      text-align: center;
      line-height: 1.4;
    }

    .card:nth-child(1) .track-title { color: #ffb07a; }
    .card:nth-child(2) .track-title { color: #8dc0ff; }
    .card:nth-child(3) .track-title { color: #f090d0; }
    .card:nth-child(4) .track-title { color: #a0dfff; }

    .ai-tag { font-size: 10px; opacity: 0.7; }

    footer {
      margin-top: 16px;
      font-family: 'Black Han Sans', sans-serif;
      font-size: 9px;
      color: #2a3d60;
      letter-spacing: 0.15em;
      position: relative;
      z-index: 1;
    }

    /* ── 오버레이 ── */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 6, 20, 0.96);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      overflow: hidden;
    }

    #overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .neon-text {
      position: relative;
      z-index: 2;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(32px, 9vw, 56px);
      font-style: italic;
      letter-spacing: 0.06em;
      transform: rotate(-4deg) scale(0.85);
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      color: #fff;
      text-shadow:
        0 0 7px #fff,
        0 0 14px #fff,
        0 0 30px #ff6ef7,
        0 0 60px #ff6ef7,
        0 0 100px #c040f0,
        0 0 140px #c040f0;
    }

    #overlay.show .neon-text {
      opacity: 1;
      transform: rotate(-4deg) scale(1);
      animation: neonFlicker 2.5s infinite 0.6s;
    }

    @keyframes neonFlicker {
      0%, 89%, 91%, 100% {
        text-shadow: 0 0 7px #fff, 0 0 14px #fff, 0 0 30px #ff6ef7, 0 0 60px #ff6ef7, 0 0 100px #c040f0, 0 0 140px #c040f0;
        opacity: 1;
      }
      90% {
        text-shadow: none;
        opacity: 0.7;
      }
    }

    /* ── 버블 ── */
    .bubble {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      animation: bubbleRise var(--dur) ease-in forwards;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.55), rgba(180,140,255,0.12));
      border: 1px solid rgba(255,255,255,0.3);
    }

    @keyframes bubbleRise {
      0%   { opacity: 0;    transform: translateY(0)     scale(0.4) translateX(0px); }
      15%  { opacity: 0.85; transform: translateY(-5vh)  scale(1)   translateX(0px); }
      80%  { opacity: 0.5; }
      100% { opacity: 0;    transform: translateY(-105vh) scale(0.7) translateX(var(--drift)); }
    }
  </style>
</head>

  </div>
</div>

<footer>sardine · 2026</footer>

<script>
  const overlay = document.getElementById('overlay');
  let destUrl = '';
  let navTimer = null;
  let busy = false;

  function spawnBubbles() {
    for (let i = 0; i < 22; i++) {
      setTimeout(() => {
        const b = document.createElement('div');
        b.className = 'bubble';
        const size = 16 + Math.random() * 48;
        const left = 3 + Math.random() * 94;
        const dur  = 2.2 + Math.random() * 2.4;
        const drift = ((Math.random() - 0.5) * 130).toFixed(1) + 'px';
        b.style.cssText = `width:${size}px;height:${size}px;left:${left}%;bottom:-70px;--dur:${dur}s;--drift:${drift};animation-delay:${(Math.random()*1.0).toFixed(2)}s`;
        overlay.appendChild(b);
        setTimeout(() => b.remove(), (dur + 2) * 1000);
      }, i * 60);
    }
  }

  function goTo(url) {
    if (busy) return;
    busy = true;
    destUrl = url;

    // 오버레이 표시
    overlay.classList.add('show');
    spawnBubbles();

    // 3초 후 이동
    navTimer = setTimeout(() => {
      location.assign(url);
    }, 5000);
  }

  document.querySelectorAll('.card').forEach(card => {
    // 터치와 클릭 둘 다 처리
    let touchMoved = false;

    card.addEventListener('touchstart', () => { touchMoved = false; }, {passive: true});
    card.addEventListener('touchmove',  () => { touchMoved = true;  }, {passive: true});
    card.addEventListener('touchend', (e) => {
      if (!touchMoved) {
        e.preventDefault();
        goTo(card.dataset.url);
      }
    });

    card.addEventListener('click', () => {
      goTo(card.dataset.url);
    });
  });
</script>
